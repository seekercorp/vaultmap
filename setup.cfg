[metadata]
name = vaultmap
version = 0.1.0
description = Lightweight secret scanning utility that maps credential patterns across local codebases and git history.
long_description = file: README.md
long_description_content_type = text/markdown
author = vaultmap contributors
license = MIT
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Topic :: Security
    Topic :: Software Development :: Quality Assurance

[options]
packages = find:
python_requires = >=3.9
install_requires =
    gitpython>=3.1

[options.entry_points]
console_scripts =
    vaultmap = vaultmap.cli:main

[options.extras_require]
dev =
    pytest>=7.0
    pytest-cov

[tool:pytest]
testpaths = tests
addopts = --tb=short -q

[flake8]
max-line-length = 100
exclude = .git,__pycache__,.venv
